<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgOg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="swirlOg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgOg)"/>

  <!-- ambient stars top-right for night-sky flavor -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="980" cy="90" r="2.2"/>
    <circle cx="1040" cy="140" r="1.6"/>
    <circle cx="900" cy="60" r="1.8"/>
    <circle cx="1100" cy="80" r="1.4"/>
    <circle cx="1060" cy="200" r="1.8"/>
  </g>

  <!-- Icon mark -->
  <g transform="translate(90,175)">
    <rect width="280" height="280" rx="64" fill="rgba(255,255,255,0.12)"/>
    <g transform="translate(24,24) scale(0.94)" fill="none" stroke="url(#swirlOg)" stroke-linecap="round">
      <path d="M120 190 H320 a38 38 0 1 0 -30 -60" stroke-width="30"/>
      <path d="M100 260 H360 a44 44 0 1 1 -34 71" stroke-width="30"/>
      <path d="M140 330 H300 a30 30 0 1 0 -24 -48" stroke-width="26"/>
    </g>
  </g>

  <text x="430" y="300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="96" font-weight="700" fill="#ffffff">Angin</text>
  <text x="432" y="360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="rgba(255,255,255,0.85)">Cuaca real-time, ringan &amp; cepat</text>
  <text x="432" y="410" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.65)">Perkiraan per jam &#8226; 7 hari &#8226; kualitas udara &#8226; PWA</text>
</svg>
